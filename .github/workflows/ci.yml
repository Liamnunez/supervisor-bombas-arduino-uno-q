name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Tests (Python + Native C++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            linux/requirements.txt
            tests/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r linux/requirements.txt
          pip install -r tests/requirements.txt 2>/dev/null || true

      - name: Run Python tests (pytest)
        working-directory: ./tests
        run: python -m pytest -v

      - name: Install g++ for native tests
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Run native C++ tests (current_protector)
        working-directory: ./tests/native
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -I ../../mcu/include \
            test_current_protector.cpp ../../mcu/src/current_protector.cpp \
            -o build/test_current_protector
          ./build/test_current_protector

  lint:
    name: Lint (pylint + cppcheck + markdownlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint deps
        run: |
          pip install pylint
          sudo apt-get update && sudo apt-get install -y cppcheck
          npm install -g markdownlint-cli@0.49.1

      - name: Install Python app deps
        run: |
          pip install -r linux/requirements.txt

      - name: Run pylint (Linux app)
        run: python -m pylint --errors-only linux.app

      - name: Run cppcheck (MCU firmware)
        working-directory: ./mcu
        run: cppcheck --enable=all --std=c++17 --suppress=missingIncludeSystem src/ include/

      - name: Run markdownlint (docs)
        run: markdownlint docs/*.md README.md tools/README.md

  firmware-syntax:
    name: Firmware Syntax Check (stub Arduino)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Arduino stub
        run: |
          mkdir -p /tmp/arduino_stub
          cat > /tmp/arduino_stub/Arduino.h << 'EOF'
          #ifndef ARDUINO_STUB_H
          #define ARDUINO_STUB_H
          #include <stdint.h>
          #include <stddef.h>

          #define HIGH 1
          #define LOW 0
          #define INPUT 0
          #define OUTPUT 1
          #define INPUT_PULLUP 2
          #define INPUT_PULLDOWN 3
          #define INPUT_ANALOG 4

          /* STM32 pin definitions (arbitrary values for syntax check) */
          #define PA0 0
          #define PA1 1
          #define PA2 2
          #define PA3 3
          #define PA4 4
          #define PA5 5
          #define PA6 6
          #define PA7 7
          #define PA8 8
          #define PA9 9
          #define PA10 10
          #define PA11 11
          #define PA12 12
          #define PA13 13
          #define PA14 14
          #define PA15 15

          #define PB0 16
          #define PB1 17
          #define PB2 18
          #define PB3 19
          #define PB4 20
          #define PB5 21
          #define PB6 22
          #define PB7 23
          #define PB8 24
          #define PB9 25
          #define PB10 26
          #define PB11 27
          #define PB12 28
          #define PB13 29
          #define PB14 30
          #define PB15 31

          #define PC0 32
          #define PC1 33
          #define PC2 34
          #define PC3 35
          #define PC4 36
          #define PC5 37
          #define PC6 38
          #define PC7 39
          #define PC8 40
          #define PC9 41
          #define PC10 42
          #define PC11 43
          #define PC12 44
          #define PC13 45
          #define PC14 46
          #define PC15 47

          class StubSerial {
          public:
              void begin(unsigned long) {}
              explicit operator bool() const { return true; }
              size_t write(const uint8_t*, size_t n) { return n; }
              void flush() {}
              int available() { return 0; }
              int read() { return -1; }
              template <typename T> size_t print(const T&) { return 0; }
              template <typename T> size_t print(const T&, int) { return 0; }
              template <typename T> size_t println(const T&) { return 0; }
              template <typename T> size_t println(const T&, int) { return 0; }
              size_t println() { return 0; }
          };
          extern StubSerial Serial;
          extern StubSerial Serial1;

          inline void pinMode(int, int) {}
          inline void digitalWrite(int, int) {}
          inline int digitalRead(int) { return 0; }
          inline int analogRead(int) { return 0; }
          inline void analogReadResolution(int) {}
          inline uint32_t millis() { return 0; }
          inline void delay(uint32_t) {}
          inline long map(long x, long, long, long, long) { return x; }
          #define constrain(x, lo, hi) ((x) < (lo) ? (lo) : ((x) > (hi) ? (hi) : (x)))

          struct IWDG_TypeDef { volatile uint32_t KR, PR, RLR; };
          extern IWDG_TypeDef iwdg_stub_instance;
          #define IWDG (&iwdg_stub_instance)

          #endif
          EOF

      - name: Syntax-check firmware
        run: |
          g++ -fsyntax-only -std=c++17 -Wall -Wextra \
            -I /tmp/arduino_stub -I mcu/include \
            -include Arduino.h mcu/src/*.cpp 2>&1 | grep -v "unused-parameter" | grep "error" && exit 1 || true

  firmware-sign:
    name: Firmware Signing (Ed25519, Fase 4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cryptography
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pytest

      # Clave EFIMERA: se genera aqui y se tira al terminar el job. La clave de
      # produccion es un secret del pipeline de release, nunca este fichero.
      - name: Generate ephemeral signing key
        run: |
          python3 tools/sign_firmware.py keygen --out-prefix /tmp/ota/ota
          test -f /tmp/ota/ota_private.key
          test -f /tmp/ota/ota_public.key
          test "$(stat -c %a /tmp/ota/ota_private.key)" = "600"

      - name: Create test firmware binary
        run: |
          dd if=/dev/urandom of=/tmp/ota/fw.bin bs=1024 count=8
          ls -l /tmp/ota/fw.bin

      - name: Sign firmware
        run: |
          python3 tools/sign_firmware.py sign /tmp/ota/fw.bin \
            --version 12 \
            --build-id 3735928559 \
            --key /tmp/ota/ota_private.key \
            --out /tmp/ota/supervisor.fwim

      # --json para que el log de CI tenga los campos del veredicto del C++.
      - name: Verify signature (must pass)
        run: |
          python3 tools/sign_firmware.py verify /tmp/ota/supervisor.fwim \
            --pubkey /tmp/ota/ota_public.key --json

      # El job tiene que FALLAR si la manipulacion no se detecta. No se usa
      # `|| true` ni se ignora el codigo de salida: la comprobacion es real.
      # `set +e` desactiva el errexit del shell de Actions para poder LEER el
      # codigo de salida del comando que se espera que falle.
      - name: Tamper payload and verify (must fail)
        run: |
          set +e
          python3 - <<'PY'
          data = bytearray(open("/tmp/ota/supervisor.fwim", "rb").read())
          # Un solo bit en el payload: el CRC-32 lo tiene que detectar.
          data[64 + 100] ^= 0x01
          open("/tmp/ota/manipulada.fwim", "wb").write(bytes(data))
          PY
          python3 tools/sign_firmware.py verify /tmp/ota/manipulada.fwim \
            --pubkey /tmp/ota/ota_public.key --json
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::una imagen manipulada verifico correctamente"
            exit 1
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::se esperaba codigo de salida 1, se obtuvo $rc"
            exit 1
          fi
          echo "OK: la manipulacion se ha detectado (codigo $rc)"

      - name: Tamper signature and verify (must fail)
        run: |
          set +e
          python3 - <<'PY'
          data = bytearray(open("/tmp/ota/supervisor.fwim", "rb").read())
          # Los ultimos 64 bytes son la firma.
          data[-1] ^= 0xFF
          open("/tmp/ota/manipulada_firma.fwim", "wb").write(bytes(data))
          PY
          python3 tools/sign_firmware.py verify /tmp/ota/manipulada_firma.fwim \
            --pubkey /tmp/ota/ota_public.key --json
          rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::se esperaba el rechazo de la firma (codigo 1), se obtuvo $rc"
            exit 1
          fi
          echo "OK: la firma manipulada se ha rechazado (codigo $rc)"

      # Anti-rollback: la imagen es la version 12, así que instalar la 12 o una
      # mayor la tiene que rechazar.
      - name: Anti-rollback check (must fail)
        run: |
          set +e
          python3 tools/sign_firmware.py verify /tmp/ota/supervisor.fwim \
            --pubkey /tmp/ota/ota_public.key --min-version 12 --json
          rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::se esperaba el rechazo por anti-rollback (codigo 1), se obtuvo $rc"
            exit 1
          fi
          echo "OK: la reinstalacion de la misma version se ha rechazado"

      # Otra clave: la firma es de A, se verifica con la publica de B.
      - name: Verify with a different key (must fail)
        run: |
          set +e
          python3 tools/sign_firmware.py keygen --out-prefix /tmp/ota/otro
          python3 tools/sign_firmware.py verify /tmp/ota/supervisor.fwim \
            --pubkey /tmp/ota/otro_public.key --json
          rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::se esperaba el rechazo por clave distinta (codigo 1), se obtuvo $rc"
            exit 1
          fi
          echo "OK: la verificacion con otra clave se ha rechazado"

      - name: No private key in the repository
        run: |
          if git ls-files | grep -Ei '\.(key|pem)$|(^|/)keys/'; then
            echo "::error::hay ficheros de clave versionados en el repo"
            exit 1
          fi
          echo "OK: no hay claves privadas en el repo"

      - name: Run sign/verify tests
        run: python3 -m pytest tests/test_sign_firmware.py -v

  build-docs:
    name: Verify docs render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check markdown files exist
        run: |
          for f in README.md docs/wiring.md docs/states.md docs/fail_safe.md; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done