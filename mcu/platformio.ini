; PlatformIO Configuration for Arduino UNO Q (STM32U585)
; MCU: STM32U585AI (Cortex-M33 @ 160MHz, 2MB Flash, 786KB RAM)

[env:uno_q]
platform = ststm32
board = uno_q
framework = arduino
board_build.mcu = stm32u585ai

; Configuración de reloj y memoria
board_build.f_cpu = 160000000L
build_flags = 
    -DSTM32U585xx
    -DUSE_HAL_DRIVER
    -DDEBUG
    -O0
    -ggdb
    -Wall
    -Wextra
    -Wpedantic
    -Wno-unused-parameter
    -Wno-missing-field-initializers

; Librerías Arduino necesarias
lib_deps = 
    ; Para comunicación serie robusta
    ArduinoStreamLib
    ; Para colas y buffers circulares
    CircularBuffer
    ; Para CRC de comunicación MCU-Linux
    FastCRC
    ; Para machine state management
    FiniteStateMachine

; Configuración de upload (ST-Link/V2 o DFU)
upload_protocol = stlink
upload_flags = 
    -c
    reset=hw
    speed=4000

; Configuración de monitor
monitor_speed = 115200
monitor_filters = 
    time
    default
    colorize

; Configuración de depuración
debug_tool = stlink
debug_port = 3333
debug_server = 
    JLinkGDBServer
    -device STM32U585AI
    -if SWD
    -speed 4000
    -port 3333
    -singlerun

; Build type
build_type = debug

; Custom targets
targets = 
    upload
    monitor
    clean